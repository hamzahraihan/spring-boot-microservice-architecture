spring.application.name=notification-service
server.port=8083
# Mail properties
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=6c7103976a8578
spring.mail.password=72542e0eb7363a

# Kafka consumer properties
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP-SERVERS:-localhost:9092}
spring.kafka.consumer.group-id=notificationService
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL:-http://host.docker.internal:8085}
spring.kafka.consumer.properties.specific.avro.reader=true

management.endpoints.web.exposure.include=*
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=notification-service
management.tracing.sampling.probability=1.0
