services:
  keycloak-mysql:
    image: mysql:8.4.9
    container_name: keycloak_mysql
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak_password
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql
      KC_DB_URL_DATABASE: keycloak

      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HTTP_ENABLED: true
    ports:
      - 8181:8080
    volumes:
      - "./docker/keycloak/realms/:/opt/keycloak/data/import/"
    depends_on:
      - keycloak-mysql
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - lgtm-network
  prometheus:
    image: prom/prometheus:latest
    command:
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # Optional: useful if you want to see the raw Prometheus UI
    networks:
      - lgtm-network
  # Grafana Tempo Tracing Backend
  tempo:
    image: grafana/tempo:2.10.0
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200" # Tempo search / frontend engine port (for Grafana UI)
      - "9411:9411" # Zipkin compatibility port (where Spring app pushes traces)
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Default UI login: admin / admin
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      # Mounts your datasource file into Grafana's automatic provisioning directory
      - ./docker/grafana:/etc/grafana/provisioning/datasources:ro
    networks:
      - lgtm-network

# Essential: Explicitly defining the shared communication bridge
networks:
  lgtm-network:
    driver: bridge

volumes:
  mysql_data:
  tempo_data:
